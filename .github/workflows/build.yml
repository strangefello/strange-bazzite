---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build container image
on:
  pull_request:
    branches:
      - main
      - testing
  schedule:
    - cron: '05 10 * * *'
  push:
    branches:
      - main
      - testing
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  NTFY_SERVER: "https://ntfy.sh"
  NTFY_USES: "niniyas/ntfy-action@master"
  NTFY_TOPIC: 'strange-bazzite-build'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image (${{ matrix.branch || github.ref_name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(github.event_name == 'schedule' && '["main","testing"]' || '[""]') }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

#      - name: Default Tag
#        id: gen-default-tag
#        run: |
#          DEFAULT_TAG=$(just generate-default-tag)
#
#          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        env:
          BRANCH: ${{ matrix.branch || github.ref_name }}
        run: |
          if [[ "${BRANCH}" == "testing" ]]; then
            DEFAULT_TAG=testing
          else
            DEFAULT_TAG=stable   # main, PRs, schedule
          fi

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "$GITHUB_ENV"

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

#      # This is optional, this provides smaller delta updates
#      - name: Rechunk with rpm-ostree
#        id: rechunk
#        run: |
#          just ostree-rechunk \
#            ${IMAGE_NAME} \
#            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      - name: Rechunk with Chunkah
        id: rechunk
        run: |
          just rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        #if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        if: >-
          github.event_name != 'pull_request' &&
          (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            github.ref == 'refs/heads/testing'
          )
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        #if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        if: >-
          github.event_name != 'pull_request' &&
          (
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            github.ref == 'refs/heads/testing'
          )
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: ntfy-success-notification
        uses: niniyas/ntfy-action@master
        if: success()
        with:
          url: ${NTFY_SERVER}
          topic: ${NTFY_TOPIC}
          priority: 4
          tags: +1,partying_face,action,successfully,completed
          details: Build ${DEFAULT_TAG} has been successfully completed!
          icon: 'https://styles.redditmedia.com/t5_32uhe/styles/communityIcon_xnt6chtnr2j21.png'
          image: true

      - name: ntfy-failed-notifications
        uses: niniyas/ntfy-action@master
        if: failure()
        with:
          url: ${NTFY_SERVER}
          topic: ${NTFY_TOPIC}
          priority: 5
          tags: +1,partying_face,action,failed
          details: Build ${DEFAULT_TAG} has failed!

      - name: ntfy-cancelled-notifications
        uses: niniyas/ntfy-action@master
        if: cancelled()
        with:
          url: ${NTFY_SERVER}
          topic: ${NTFY_TOPIC}
          priority: 3
          tags: +1,partying_face,action,cancelled
          details: Build ${DEFAULT_TAG} has been cancelled!